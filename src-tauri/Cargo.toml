[package]
name = "codex-dashboard"
version = "0.1.0"
description = "Monitor and control multiple Codex sessions"
authors = ["Codex Dashboard contributors"]
edition = "2021"

[lib]
name = "codex_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
thiserror = "2"
url = "2"
